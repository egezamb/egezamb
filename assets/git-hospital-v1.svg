<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 556" width="1200" height="556" role="img" aria-label="Git Hospital is an open-source organization I co-run: tools that diagnose infrastructure and code, and show the evidence for every diagnosis. Helmbulance: what: installs a Helm chart on a throwaway kind cluster and runs the day-2 operations static checks miss. runs: upgrades with and without the original values · rollbacks · reinstalls · upgrades under live traffic · GitOps renders. rule: a finding is reported only when it reproduces on the cluster. me: the CLI and the test scenarios · 80 merged PRs. release: v0.1.0 · network-isolation next.">
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/></pattern>
<pattern id="gridneg" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#000000" stroke-opacity="0.06" stroke-width="1"/></pattern>
<clipPath id="frame"><rect width="1200" height="556" rx="18"/></clipPath>
</defs>
<style>
@font-face { font-family: 'JBM'; src: url(data:font/woff2;base64,) format('woff2'); }
@font-face { font-family: 'SGP'; src: url(data:font/woff2;base64,) format('woff2'); }
.cmd  { font: 500 22px 'JBM', 'SFMono-Regular', Menlo, Consolas, monospace; fill: #e5e5e5; }
.meta { font: 500 16px 'JBM', 'SFMono-Regular', Menlo, Consolas, monospace; fill: #737373; }
.tag  { font: 500 16px 'JBM', 'SFMono-Regular', Menlo, Consolas, monospace; fill: #737373; }
.ok   { fill: #ffffff; }
.key  { font: 500 18px 'JBM', 'SFMono-Regular', Menlo, Consolas, monospace; fill: #737373; }
.eq   { font: 500 18px 'JBM', 'SFMono-Regular', Menlo, Consolas, monospace; fill: #525252; }
.val  { font: 500 18px 'JBM', 'SFMono-Regular', Menlo, Consolas, monospace; fill: #e5e5e5; }
.id   { font: 500 18px 'JBM', 'SFMono-Regular', Menlo, Consolas, monospace; fill: #ffffff; }
.note { font: 500 16px 'JBM', 'SFMono-Regular', Menlo, Consolas, monospace; fill: #525252; }
.para { font: 400 26px 'SGP', 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #0a0a0a; }
.bar  { animation: grow 14s ease-out .4s infinite; transform-origin: 70px 0; }
.row  { opacity: 0; animation: cycle 14s ease-out infinite; }
.siren { animation: blink .9s step-end infinite; }
.drive { animation: drive 14s linear infinite; }
@keyframes grow  { 0% { transform: scaleX(0); } 8%, 90% { transform: scaleX(1); } 100% { transform: scaleX(0); } }
@keyframes cycle { 0% { opacity: 0; transform: translateY(14px); } 5%, 82% { opacity: 1; transform: none; } 90%, 100% { opacity: 0; transform: none; } }
@keyframes blink { 50% { opacity: 0; } }
@keyframes drive { 0% { transform: translateX(-80px); } 100% { transform: translateX(1240px); } }
.typer0 { animation: type0 14s steps(21) .4s infinite; }@keyframes type0 { 0% { width: 0; } 8%, 90% { width: 285px; } 100% { width: 0; } }@media (prefers-reduced-motion: reduce) { .typer0 { width: 285px; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } .row { opacity: 1; } .bar { transform: none; } }
</style>
<g clip-path="url(#frame)">
<rect width="1200" height="556" fill="#000000"/>
<rect width="1200" height="556" fill="url(#grid)"/>
<g class="row" style="animation-delay:1.30s"><rect x="0" y="0" width="1200" height="152" fill="#ffffff"/><rect x="0" y="0" width="1200" height="152" fill="url(#gridneg)"/><text class="para" x="70" y="52">Git Hospital is an open-source organization I co-run: tools that</text><text class="para" x="70" y="90">diagnose infrastructure and code, and show the evidence for every diagnosis.</text><text class="tag" x="1130" y="30" text-anchor="end">// git-hospital</text></g><g class="drive"><g transform="translate(0,122)" style="filter:invert(1)"><rect x="0" y="2" width="25" height="14" rx="2" fill="#ffffff"/><path d="M25 6H32L37 11V16H25Z" fill="#ffffff"/><path d="M27 8H31.2L34.2 11H27Z" fill="#000000"/><rect x="10.75" y="4.5" width="3.5" height="9" fill="#000000"/><rect x="8" y="7.25" width="9" height="3.5" fill="#000000"/><circle cx="7" cy="16.5" r="3.2" fill="#ffffff" stroke="#000000" stroke-width="1.6"/><circle cx="30" cy="16.5" r="3.2" fill="#ffffff" stroke="#000000" stroke-width="1.6"/><rect class="siren" x="4" y="-1" width="6" height="3" rx="1" fill="#ffffff"/></g></g><clipPath id="t0"><rect class="typer0" x="70" y="194" height="36" width="0"/></clipPath><g clip-path="url(#t0)"><text class="cmd" x="70" y="222"><tspan class="ok">$</tspan> cat helmbulance.ini</text></g><text class="meta" x="1130" y="222" text-anchor="end">~/git-hospital</text><rect class="bar" x="70" y="244" width="96" height="4" rx="2" fill="#ffffff"/><g class="row" style="animation-delay:1.44s"><text class="key" x="70" y="288">what</text><text class="eq" x="200" y="288">=</text><text class="val" x="232" y="288">installs a Helm chart on a throwaway kind cluster and runs the day-2 operations</text></g><g class="row" style="animation-delay:1.58s"><text class="val" x="232" y="314">static checks miss</text></g><g class="row" style="animation-delay:1.72s"><text class="key" x="70" y="348">runs</text><text class="eq" x="200" y="348">=</text><text class="val" x="232" y="348">upgrades with and without the original values · rollbacks · reinstalls · upgrades</text></g><g class="row" style="animation-delay:1.86s"><text class="val" x="232" y="374">under live traffic · GitOps renders</text></g><g class="row" style="animation-delay:2.00s"><text class="key" x="70" y="408">rule</text><text class="eq" x="200" y="408">=</text><text class="val" x="232" y="408">a finding is reported only when it reproduces on the cluster</text></g><g class="row" style="animation-delay:2.14s"><text class="key" x="70" y="442">me</text><text class="eq" x="200" y="442">=</text><text class="val" x="232" y="442">the CLI and the test scenarios · 80 merged PRs</text></g><g class="row" style="animation-delay:2.28s"><text class="key" x="70" y="476">release</text><text class="eq" x="200" y="476">=</text><text class="val" x="232" y="476">v0.1.0 · network-isolation next</text></g><g class="row" style="animation-delay:2.42s"><text class="note" x="70" y="520"># the bugs it found in public charts went upstream as fixes ↓</text></g>
</g>
</svg>
