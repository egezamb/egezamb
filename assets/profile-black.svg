<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 402" width="1200" height="402" role="img" aria-label="Profile: role Cloud &amp; infrastructure engineer · full-stack background; focus AWS · Azure · Terraform · Docker · Kubernetes · Helm · CI/CD; ops Linux · production deploys · secrets · backups · monitoring; backend Python · FastAPI · Node.js · Go · PostgreSQL · REST APIs; frontend React · Next.js · TypeScript · React Native / Expo; ai LLM &amp; vision APIs · AI image / video pipelines; location Wrocław, PL; education BEng Computer Science (Software Development), WSB Merito — 2027; contact egezambelli1@gmail.com">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#000000"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.4" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="402" rx="18"/></clipPath>
    <clipPath id="type"><rect class="typer" x="70" y="56" height="36" width="0"/></clipPath>
  </defs>

  <style>
    @font-face { font-family: 'JBM'; src: url(data:font/woff2;base64,) format('woff2'); }
    @font-face { font-family: 'JBM'; src: url(data:font/woff2;base64,) format('woff2'); unicode-range: U+0142; }
    .cmd   { font: 500 22px 'JBM', 'SFMono-Regular', Menlo, Consolas, monospace; fill: #e5e5e5; }
    .meta  { font: 500 16px 'JBM', 'SFMono-Regular', Menlo, Consolas, monospace; fill: #737373; }
    .key   { font: 500 18px 'JBM', 'SFMono-Regular', Menlo, Consolas, monospace; fill: #737373; }
    .eq    { font: 500 18px 'JBM', 'SFMono-Regular', Menlo, Consolas, monospace; fill: #525252; }
    .val   { font: 500 18px 'JBM', 'SFMono-Regular', Menlo, Consolas, monospace; fill: #e5e5e5; }
    .ok    { fill: #ffffff; }
    .typer { animation: typing .9s steps(19) .2s forwards; }
    .bar   { animation: grow 1.2s ease-out .5s both; transform-origin: 70px 0; }
    .row   { opacity: 0; animation: rise .7s ease-out forwards; }
    @keyframes typing { to { width: 300px; } }
    @keyframes grow   { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes rise   { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; opacity: 1 !important; } .typer { width: 300px; } }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1200" height="402" fill="url(#bg)"/>
    <rect width="1200" height="402" fill="url(#grid)"/>

    <g clip-path="url(#type)">
      <text class="cmd" x="70" y="84"><tspan class="ok">$</tspan> cat ~/profile.ini</text>
    </g>
    <text class="meta" x="1130" y="84" text-anchor="end">~/egezamb</text>
    <rect class="bar" x="70" y="106" width="96" height="4" rx="2" fill="#ffffff"/>

    <g class="row" style="animation-delay:0.90s"><text class="key" x="70" y="146">role</text><text class="eq" x="200" y="146">=</text><text class="val" x="232" y="146">Cloud &amp; infrastructure engineer · full-stack background</text></g>
    <g class="row" style="animation-delay:1.02s"><text class="key" x="70" y="172">focus</text><text class="eq" x="200" y="172">=</text><text class="val" x="232" y="172">AWS · Azure · Terraform · Docker · Kubernetes · Helm · CI/CD</text></g>
    <g class="row" style="animation-delay:1.14s"><text class="key" x="70" y="198">ops</text><text class="eq" x="200" y="198">=</text><text class="val" x="232" y="198">Linux · production deploys · secrets · backups · monitoring</text></g>
    <g class="row" style="animation-delay:1.26s"><text class="key" x="70" y="224">backend</text><text class="eq" x="200" y="224">=</text><text class="val" x="232" y="224">Python · FastAPI · Node.js · Go · PostgreSQL · REST APIs</text></g>
    <g class="row" style="animation-delay:1.38s"><text class="key" x="70" y="250">frontend</text><text class="eq" x="200" y="250">=</text><text class="val" x="232" y="250">React · Next.js · TypeScript · React Native / Expo</text></g>
    <g class="row" style="animation-delay:1.50s"><text class="key" x="70" y="276">ai</text><text class="eq" x="200" y="276">=</text><text class="val" x="232" y="276">LLM &amp; vision APIs · AI image / video pipelines</text></g>
    <g class="row" style="animation-delay:1.62s"><text class="key" x="70" y="302">location</text><text class="eq" x="200" y="302">=</text><text class="val" x="232" y="302">Wrocław, PL</text></g>
    <g class="row" style="animation-delay:1.74s"><text class="key" x="70" y="328">education</text><text class="eq" x="200" y="328">=</text><text class="val" x="232" y="328">BEng Computer Science (Software Development), WSB Merito — 2027</text></g>
    <g class="row" style="animation-delay:1.86s"><text class="key" x="70" y="354">contact</text><text class="eq" x="200" y="354">=</text><text class="val" x="232" y="354">egezambelli1@gmail.com</text></g>

  </g>
</svg>
