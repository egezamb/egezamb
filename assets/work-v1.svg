.drive { animation: drive 14s linear infinite; }
@keyframes grow  { 0% { transform: scaleX(0); } 8%, 90% { transform: scaleX(1); } 100% { transform: scaleX(0); } }
@keyframes cycle { 0% { opacity: 0; transform: translateY(14px); } 5%, 82% { opacity: 1; transform: none; } 90%, 100% { opacity: 0; transform: none; } }
@keyframes blink { 50% { opacity: 0; } }
@keyframes drive { 0% { transform: translateX(-80px); } 100% { transform: translateX(1240px); } }
.typer0 { animation: type0 14s steps(11) .4s infinite; }@keyframes type0 { 0% { width: 0; } 8%, 90% { width: 153px; } 100% { width: 0; } }@media (prefers-reduced-motion: reduce) { .typer0 { width: 153px; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } .row { opacity: 1; } .bar { transform: none; } }
</style>
