.para { font: 400 26px 'SGP', 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #0a0a0a; }
.bar  { animation: grow 14s ease-out .4s infinite; transform-origin: 70px 0; }
.row  { opacity: 0; animation: cycle 14s ease-out infinite; }
