<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 376" width="1200" height="376" role="img" aria-label="What I work on. cloud: production on AWS and Azure · infrastructure in Terraform · least-privilege IAM · secrets in SSM · backups and alarms. delivery: Docker images · Helm charts · CI/CD pipelines with test gates and image scanning · automated deploys. products: SaaS platforms (real estate CRM, warehouse management) · AI products · iOS / Android apps with React Native. Most of it is private: products i own, build with partners, or deliver to clients.">
