<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 588" width="1200" height="588" role="img" aria-label="Open source contributions merged upstream. seaweedfs: #11720 the first upgrade restarted the filer and the S3 gateway; #12137 an unquoted number or boolean in extraEnvironmentVars failed the install; #12138 a reinstall wrote a new filer database password; #12139 user-set MySQL credentials were rendered twice; Helm 4 refused the install. jupyterhub: #3997 random passwords made once per render: no restart on the first upgrade. reloader: #1270 no Job is created for a suspended CronJob; #1271 the chart grants update on cronjobs/finalizers; #1281 golang.org/x/net bumped to v0.62.0 on the v2 line. openarchiver: #493 the database password was URL-encoded twice in DATABASE_URL. achilles: #29 a snapshot the CVE lookups can&#x27;t read is rejected before it is cached; #28 deno listed in the collector schema&#x27;s runtimes and frameworks. hanko: #2996 release artifact names include the version.">
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/></pattern>
<pattern id="gridneg" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#000000" stroke-opacity="0.06" stroke-width="1"/></pattern>
<clipPath id="frame"><rect width="1200" height="588" rx="18"/></clipPath>
</defs>
<style>
@font-face { font-family: 'JBM'; src: url(data:font/woff2;base64,) format('woff2'); }
.cmd  { font: 500 22px 'JBM', 'SFMono-Regular', Menlo, Consolas, monospace; fill: #e5e5e5; }
.meta { font: 500 16px 'JBM', 'SFMono-Regular', Menlo, Consolas, monospace; fill: #737373; }
.tag  { font: 500 16px 'JBM', 'SFMono-Regular', Menlo, Consolas, monospace; fill: #737373; }
.ok   { fill: #ffffff; }
.key  { font: 500 18px 'JBM', 'SFMono-Regular', Menlo, Consolas, monospace; fill: #737373; }
.eq   { font: 500 18px 'JBM', 'SFMono-Regular', Menlo, Consolas, monospace; fill: #525252; }
.val  { font: 500 18px 'JBM', 'SFMono-Regular', Menlo, Consolas, monospace; fill: #e5e5e5; }
.id   { font: 500 18px 'JBM', 'SFMono-Regular', Menlo, Consolas, monospace; fill: #ffffff; }
.note { font: 500 16px 'JBM', 'SFMono-Regular', Menlo, Consolas, monospace; fill: #525252; }
.para { font: 400 26px 'SGP', 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #0a0a0a; }
.bar  { animation: grow 14s ease-out .4s infinite; transform-origin: 70px 0; }
.row  { opacity: 0; animation: cycle 14s ease-out infinite; }
.siren { animation: blink .9s step-end infinite; }
.drive { animation: drive 14s linear infinite; }
@keyframes grow  { 0% { transform: scaleX(0); } 8%, 90% { transform: scaleX(1); } 100% { transform: scaleX(0); } }
@keyframes cycle { 0% { opacity: 0; transform: translateY(14px); } 5%, 82% { opacity: 1; transform: none; } 90%, 100% { opacity: 0; transform: none; } }
@keyframes blink { 50% { opacity: 0; } }
@keyframes drive { 0% { transform: translateX(-80px); } 100% { transform: translateX(1240px); } }
.typer0 { animation: type0 14s steps(44) .4s infinite; }@keyframes type0 { 0% { width: 0; } 8%, 90% { width: 589px; } 100% { width: 0; } }@media (prefers-reduced-motion: reduce) { .typer0 { width: 589px; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } .row { opacity: 1; } .bar { transform: none; } }
</style>
<g clip-path="url(#frame)">
<rect width="1200" height="588" fill="#000000"/>
<rect width="1200" height="588" fill="url(#grid)"/>
<clipPath id="t0"><rect class="typer0" x="70" y="56" height="36" width="0"/></clipPath><g clip-path="url(#t0)"><text class="cmd" x="70" y="84"><tspan class="ok">$</tspan> git log --merged --author=egezamb upstream</text></g><text class="meta" x="1130" y="84" text-anchor="end">~/upstream</text><rect class="bar" x="70" y="106" width="96" height="4" rx="2" fill="#ffffff"/><g class="row" style="animation-delay:1.30s"><text class="key" x="70" y="150">seaweedfs</text><text class="id" x="232" y="150">#11720</text><text class="val" x="330" y="150">the first upgrade restarted the filer and the S3 gateway</text></g><g class="row" style="animation-delay:1.44s"><text class="key" x="70" y="178"></text><text class="id" x="232" y="178">#12137</text><text class="val" x="330" y="178">an unquoted number or boolean in extraEnvironmentVars failed the install</text></g><g class="row" style="animation-delay:1.58s"><text class="key" x="70" y="206"></text><text class="id" x="232" y="206">#12138</text><text class="val" x="330" y="206">a reinstall wrote a new filer database password</text></g><g class="row" style="animation-delay:1.72s"><text class="key" x="70" y="234"></text><text class="id" x="232" y="234">#12139</text><text class="val" x="330" y="234">user-set MySQL credentials were rendered twice; Helm 4 refused the install</text></g><g class="row" style="animation-delay:1.86s"><text class="key" x="70" y="272">jupyterhub</text><text class="id" x="232" y="272">#3997</text><text class="val" x="330" y="272">random passwords made once per render: no restart on the first upgrade</text></g><g class="row" style="animation-delay:2.00s"><text class="key" x="70" y="310">reloader</text><text class="id" x="232" y="310">#1270</text><text class="val" x="330" y="310">no Job is created for a suspended CronJob</text></g><g class="row" style="animation-delay:2.14s"><text class="key" x="70" y="338"></text><text class="id" x="232" y="338">#1271</text><text class="val" x="330" y="338">the chart grants update on cronjobs/finalizers</text></g><g class="row" style="animation-delay:2.28s"><text class="key" x="70" y="366"></text><text class="id" x="232" y="366">#1281</text><text class="val" x="330" y="366">golang.org/x/net bumped to v0.62.0 on the v2 line</text></g><g class="row" style="animation-delay:2.42s"><text class="key" x="70" y="404">openarchiver</text><text class="id" x="232" y="404">#493</text><text class="val" x="330" y="404">the database password was URL-encoded twice in DATABASE_URL</text></g><g class="row" style="animation-delay:2.56s"><text class="key" x="70" y="442">achilles</text><text class="id" x="232" y="442">#29</text><text class="val" x="330" y="442">a snapshot the CVE lookups can&#x27;t read is rejected before it is cached</text></g><g class="row" style="animation-delay:2.70s"><text class="key" x="70" y="470"></text><text class="id" x="232" y="470">#28</text><text class="val" x="330" y="470">deno listed in the collector schema&#x27;s runtimes and frameworks</text></g><g class="row" style="animation-delay:2.84s"><text class="key" x="70" y="508">hanko</text><text class="id" x="232" y="508">#2996</text><text class="val" x="330" y="508">release artifact names include the version</text></g><g class="row" style="animation-delay:2.98s"><text class="note" x="70" y="552"># each Helm chart fix was reproduced on a kind cluster before it was sent</text></g>
</g>
</svg>
